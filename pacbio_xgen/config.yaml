# ════════════════════════════════════════════════════════════════════════════════
# Phasing — shared
# ════════════════════════════════════════════════════════════════════════════════
# Donor to phase (tissues auto-detected from sample_metadata.csv). Read by BOTH
# phasing_withSR.smk and phasing.smk.
phasing_donor: "TSP33"
# phasing_tissues: "T3,T4,T5"        # optional explicit override of the tissue list

# ════════════════════════════════════════════════════════════════════════════════
# phasing_withSR.smk — short-read-based phasing (GATK variant calling → WhatsHap)
# ════════════════════════════════════════════════════════════════════════════════
# Provide ONE of:
#   input_vcf:      path to a pre-called het-SNP VCF (bgzipped) — skips GATK
#   short_read_bam: path to a short-read WGS/WES DNA BAM — variants called with GATK
# input_vcf: "/path/to/donor_hets.vcf.gz"
# short_read_bam: "/path/to/donor.wgs.bam"

# Output root for the short-read pipeline (under work_directory)
phasing_withSR_dir: "phasing_withSR"

# Rule-specific resource overrides for phasing_withSR.smk
phasing_withSR_resources:
    gatk_haplotype_caller:
        mem: "200G"
        time: "1-00:00:00"
        threads: 32
        partition: "owners"
    gatk_genotype_gvcfs:
        mem: "64G"
        time: "8:00:00"
        threads: 8
        partition: "owners"
    filter_het_snps:
        mem: "32G"
        time: "2:00:00"
        threads: 4
        partition: "owners"
    whatshap_phase:
        mem: "200G"
        time: "1-00:00:00"
        threads: 8
        partition: "owners"
    whatshap_stats:
        mem: "32G"
        time: "2:00:00"
        threads: 1
        partition: "owners"
    whatshap_haplotag:
        mem: "100G"
        time: "8:00:00"
        threads: 8
        partition: "owners"
    index_haplotagged_bam:
        mem: "16G"
        time: "1:00:00"
        threads: 8
        partition: "owners"

# ════════════════════════════════════════════════════════════════════════════════
# phasing.smk — long-read-only phasing (no short reads)
# ════════════════════════════════════════════════════════════════════════════════
# Output root for the long-read pipeline (under work_directory)
phasing_dir: "phasing"

# Variant caller for the WhatsHap branch: "mpileup" (default) or "clair3_rna"
lr_variant_caller: "clair3_rna"

# het-SNP calling/filtering. NOTE: lr_min_dp/lr_min_qual/lr_ab_* apply to the het FILTER
# for BOTH callers (mpileup and clair3_rna), not just mpileup. lr_min_mapq/baseq/max_depth
# are mpileup-only. (defaults shown; uncomment to override)
# lr_min_mapq: 20
# lr_min_baseq: 10
# lr_max_depth: 10000
# lr_min_dp: 10
# Clair3-RNA QUAL is NOT phred-scaled (real PASS variants ~10-20), so the mpileup-era
# default of 20 discards ~99.9% of clair3 hets. Use ~10 for clair3_rna.
lr_min_qual: 10
# lr_ab_min: 0.25
# lr_ab_max: 0.75
# lr_exclude_rna_editing: false      # drop A>G / T>C (ADAR signature) from the het set

# Clair3-RNA (used when lr_variant_caller: "clair3_rna")
clair3_rna_bin: "/oak/stanford/groups/quake/mmantri/mydata/tools/Clair3-RNA/run_clair3_rna"
clair3_rna_platform: "hifi_mas_pbmm2"       # PacBio Revio MAS-Seq, pbmm2-aligned
# clair3_rna_pileup_model_path: ""           # optional -P override; auto-located from platform if unset
clair3_rna_tag_rnaediting: true              # tag + drop REDIportal RNA-editing sites (GRCh38)

# cDNA_Cupcake IsoPhase (separate `all_isophase` target)
isophase_scripts_dir: "/oak/stanford/groups/quake/mmantri/mydata/tools/cDNA_Cupcake/phasing"
isophase_min_coverage: 40
# IsoPhase target genes — leave BOTH unset to run transcriptome-wide (slow at single-cell
# scale). Set one to restrict to specific genes (resolved to PB loci via pigeon
# classification, then FLNC/gff/read_stat are subset so it runs in minutes):
#   isophase_genes: "CDKN2A,TPM1,MYL6"        # comma-separated gene symbols, or
#   isophase_gene_list: "/path/to/genes.txt"  # file, one gene symbol per line

# Conda environments (activated per rule via shell.prefix)
conda_sh: "/home/groups/quake/mmantri/miniconda3/etc/profile.d/conda.sh"
phasing_conda_env: "isophase"                # mpileup + IsoPhase + WhatsHap downstream
clair3_rna_conda_env: "clair3_rna"           # Clair3-RNA caller rule only

# Rule-specific resource overrides for phasing.smk (long-read-only)
phasing_resources:
    merge_lr_pooled_bam:
        mem: "200G"
        time: "12:00:00"
        threads: 16
        partition: "quake"
    lr_call_variants:                        # mpileup branch
        mem: "96G"
        time: "2-00:00:00"
        threads: 16
        partition: "quake"
    clair3_rna_call_variants:                # clair3_rna branch
        mem: "128G"
        time: "2-00:00:00"
        threads: 24
        partition: "quake"
    lr_filter_het_snps:
        mem: "32G"
        time: "2:00:00"
        threads: 4
        partition: "quake"
    whatshap_phase:
        mem: "200G"
        time: "1-00:00:00"
        threads: 8
        partition: "quake"
    whatshap_stats:
        mem: "32G"
        time: "2:00:00"
        threads: 1
        partition: "quake"
    whatshap_haplotag:                       # per-tissue (22 jobs) -> owners
        mem: "100G"
        time: "8:00:00"
        threads: 8
        partition: "owners"
    index_haplotagged_bam:                   # per-tissue (22 jobs) -> owners
        mem: "16G"
        time: "1:00:00"
        threads: 8
        partition: "owners"
    prepare_isophase_inputs:                 # IsoPhase branch (full or gene-subset inputs)
        mem: "32G"
        time: "12:00:00"
        threads: 8
        partition: "quake"
    isophase_run:                            # IsoPhase branch
        mem: "100G"
        time: "1-00:00:00"
        threads: 16
        partition: "quake"
