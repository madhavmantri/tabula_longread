# Reference genome information
reference_genome: "/oak/stanford/groups/quake/mmantri/group.quake/references/gencode_GRCh38.p13_release41/GRCh38.primary_assembly.genome.fa"
reference_gtf: "/oak/stanford/groups/quake/mmantri/group.quake/references/gencode_GRCh38.p13_release41/gencode.v41.annotation.gtf"

# Extra files
primer_fasta: "/oak/stanford/groups/quake/mmantri/group.quake/tabula_longread/pacbio/MAS-Seq_Adapter_v1/mas16_primers.fasta"

# Input paths
raw_data_directory: "/oak/stanford/groups/quake/shared/pacbio_raw/"
work_directory: "/oak/stanford/groups/quake/mmantri/group.quake/tabula_longread/pacbio_xgen/"

# CSV listing the HiFi sample locations (one row per tissue).
# Columns: tissue,hifi_dir   (hifi_dir = per-tissue directory containing .bam files)
# Add new tissues from other roots here. Tissue names must be unique.
hifi_locations_csv: "/oak/stanford/groups/quake/mmantri/group.quake/tabula_longread/csvs/hifi_locations.csv"

# Subfolder under work_directory to save recollapsed results and to use for squanti3 pipeline
# e.g. "recollapsed", "recollapsed_samplelist1", "recollapsed_samplelist2"
recollapsed_directory: "recollapsed"

# syncronize.smk: donor(s) whose tissues are dropped from the sync/recollapse
# branch. Accepts a YAML list (below) or a comma-separated string via --config.
# Resolved donor -> tube_id through sample_metadata_csv. TSP33.1 -> X33 (the
# duplicate xGen pulldown of TSP33/T73); TSP31 has no xGen sample (defensive).
exclude_donor:
  - TSP33.1
  - TSP31

# Metadata table (tube_id,donor,...) used to resolve exclude_donor for the xGen
# samples, which are absent from the main csvs/sample_metadata.csv.
sample_metadata_csv: "/oak/stanford/groups/quake/mmantri/group.quake/tabula_longread/csvs/xgen_metadata.csv"

# Tool paths
isoannotlite_script: "/oak/stanford/groups/quake/mmantri/mydata/tools/SQANTI3_v6.0.1_patched/src/utilities/IsoAnnotLite_SQ3.py"
sqanti3_qc_script: "/oak/stanford/groups/quake/mmantri/mydata/tools/SQANTI3_v6.0.1_patched/sqanti3_qc.py"
sqanti3_filter_script: "/oak/stanford/groups/quake/mmantri/mydata/tools/SQANTI3_v6.0.1_patched/sqanti3_filter.py"

# SQANTI3 annotation files
cage_peak: "/oak/stanford/groups/quake/mmantri/mydata/tools/SQANTI3_v5.5.4/data/ref_TSS_annotation/human.refTSS_v3.1.hg38.bed"
polyA_motif_list: "/oak/stanford/groups/quake/mmantri/mydata/tools/SQANTI3_v5.5.4/data/polyA_motifs/mouse_and_human.polyA_motif.txt"

# Subsampling
max_reads_per_barcode: 300000

# Percentile cutoff for isoseq correct + bcstats real-cell calling
# (cutoff = UMI count at top (100-P)% rank × 10; barcodes with UMIs >= cutoff are real cells)
percentile_cutoff: 90

# Optional parameters
keep_novel_genes: false
keep_ribo_mito_genes: false

# Group dedup split defaults
barcode_tag: "CB"        

# SLURM resource defaults
threads: 32
default_memory: "150G"
partition: "owners"
time: "6:00:00"
slurm_extra: ""

